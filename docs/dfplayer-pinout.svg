<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="title desc">
<title id="title">DFPlayer Mini pinout with this project's connections highlighted</title>
<desc id="desc">The DFPlayer Mini module with the microSD slot at the top. Sixteen pins, eight per side. Left side top to bottom: pin 1 VCC to board row 12 as 5 volts; pin 2 RX to board row 14, the signal from GPIO17; pin 3 TX left unconnected; pins 4 and 5 DAC right and left, unused; pin 6 SPK_1 to the speaker; pin 7 GND to board row 13; pin 8 SPK_2 to the speaker. The two speaker pins are labelled in the opposite order on some variants; either way they are the two ends of one bridged output and are interchangeable. The right side carries auxiliary functions not used here: BUSY, USB minus and plus, ADKEY2, ADKEY1, IO2, a second GND at pin 10, and IO1. The three board conductors are not adjacent: VCC and RX sit at pins 1 and 2, but GND is five pins further down.</desc>

<style>
  .bg   { fill: #ffffff; }
  .body { fill: none; stroke: #656d76; }
  .slot { fill: #eaeef2; stroke: #afb8c1; }
  .lead { stroke: #8c959f; }
  .hole { fill: none; stroke: #8c959f; }
  .t1   { fill: #1f2328; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t2   { fill: #57606a; font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tn   { fill: #8c959f; font: 400 10px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .hd   { fill: #1f2328; font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .dim  { opacity: .45; }
  .c5v  { fill: #d1242f; }
  .csig { fill: #0969da; }
  .cgnd { fill: #424a53; }
  .cspk { fill: #9a6700; }
  .rule { stroke: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #0d1117; }
    .body { stroke: #8b949e; }
    .slot { fill: #21262d; stroke: #484f58; }
    .lead { stroke: #6e7681; }
    .hole { stroke: #6e7681; }
    .t1   { fill: #e6edf3; }
    .t2   { fill: #9198a1; }
    .tn   { fill: #6e7681; }
    .hd   { fill: #e6edf3; }
    .c5v  { fill: #ff7b72; }
    .csig { fill: #58a6ff; }
    .cgnd { fill: #9198a1; }
    .cspk { fill: #d29922; }
    .rule { stroke: #30363d; }
  }
</style>

