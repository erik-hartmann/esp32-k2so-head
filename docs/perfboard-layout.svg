<line class="rule" x1="20" y1="336" x2="680" y2="336" stroke-width="1"/>

<text class="t1" x="20" y="358">Per device — uniform 4-row block</text>
<text class="t2" x="20" y="376">rows n / n+1 · JST 5 V and GND in column G, jumpered from column J to the right rails</text>
<text class="t2" x="20" y="392">row n+2 · JST signal in G, 330 Ω bridging E↔F, landing on the screw terminal at B</text>
<text class="t2" x="20" y="408">row n+3 · left spare</text>

<text class="t1" x="20" y="436">GPIO terminals — dead pin above the live one</text>
<text class="t2" x="20" y="454">B5+B6 → GPIO25 · B9+B10 → GPIO26 · B13+B14 → GPIO17</text>
<text class="t2" x="20" y="470">The dead pin's row is that device's GND row, whose A–E half is unused — power lands only in F–J</text>

<circle class="f5v" cx="470" cy="352" r="4"/><text class="t2" x="482" y="356">5 V</text>
<circle class="fgnd" cx="470" cy="372" r="4"/><text class="t2" x="482" y="376">ground</text>
<circle class="fsig" cx="470" cy="392" r="4"/><text class="t2" x="482" y="396">signal</text>
<circle class="hole" cx="470" cy="412" r="3.5" stroke-width="1.3"/><text class="t2" x="482" y="416">dead pin</text>
<line class="s5v" x1="560" y1="352" x2="588" y2="352" stroke-width="1.4" stroke-dasharray="3 2"/><text class="t2" x="596" y="356">jumper (on back)</text>
<rect class="res" x="562" y="366" width="24" height="12" rx="4" stroke-width="0.7"/><text class="t2" x="596" y="376">330 Ω ×3</text>
</svg>
