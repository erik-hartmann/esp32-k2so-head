<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" role="img" aria-labelledby="title desc">
<title id="title">K-2SO interface board — front and back, as built</title>
<desc id="desc">Front and back views of the 15-row interface board. Left rails carry POWER IN at row 1, a 1000 microfarad capacitor at row 8, and the PCA9685 terminal at row 15. Right rails carry the ESP32 terminal at row 1 and a spare AUX terminal at row 15. Both rail links share row 3. Three devices sit in column G. LED A occupies rows 4 to 6 and LED B rows 8 to 10, each a three-pin connector with 5 volts, ground and a data line. The DFPlayer occupies rows 12 to 15 as a four-pin connector: 5 volts, ground, serial receive, and BUSY. Each device's 5 volt and ground jumpers leave from column J to the right rails on the back. A 330 ohm resistor bridges the centre channel on rows 6, 10 and 14, and a plain wire with no resistor bridges row 15 for BUSY. Two-pin screw terminals in column B carry the signals out: B5 and B6 for GPIO25 and B9 and B10 for GPIO26, each with a dead pin above the live one, while B14 and B15 have both pins live, carrying GPIO17 and GPIO16.</desc>

