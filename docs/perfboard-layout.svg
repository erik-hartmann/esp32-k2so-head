<text class="t1" x="20" y="358">LED blocks — rows 4–6 and 8–10</text>
<text class="t2" x="20" y="376">3-pin in column G: 5 V, GND, DIN. Jumpers from J to the right rails. 330 Ω bridges E↔F on the</text>
<text class="t2" x="20" y="392">third row to a screw terminal at B, whose upper pin is a dead stub — B5+B6 → GPIO25, B9+B10 → GPIO26.</text>

<text class="t1" x="20" y="420">DFPlayer block — rows 12–15</text>
<text class="t2" x="20" y="438">4-pin in column G: 5 V, GND, RX, BUSY. Power jumpers from J12 and J13 as before. Row 14 keeps its</text>
<text class="t2" x="20" y="454">330 Ω; row 15 is a plain link, no resistor — BUSY is a slow status level, not fast data.</text>
<text class="t2" x="20" y="470">The terminal sits at B14+B15 with <tspan class="t1">both pins live</tspan>: B14 → GPIO17, B15 → GPIO16. No dead stub here.</text>

