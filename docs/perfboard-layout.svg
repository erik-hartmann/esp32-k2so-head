<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img" aria-labelledby="title desc">
<title id="title">K-2SO interface board — front and back, as built</title>
<desc id="desc">Front and back views of the finished 15-row interface board. Left rails carry POWER IN at row 1, a 1000 microfarad capacitor at row 8, and the PCA9685 terminal at row 15. Right rails carry the ESP32 terminal at row 1 and a spare AUX terminal at row 15. Both rail links share row 3. Three devices sit on a uniform four-row pitch with their three-pin JST connectors in column G: LED A at rows 4 to 6, LED B at rows 8 to 10, DFPlayer at rows 12 to 14. Each device's 5V and ground jumpers leave from column J to the right rails, using a separate hole from the connector in the same node. A 330 ohm resistor bridges the centre channel on each device's third row, reaching a GPIO screw terminal in column B whose dead pin sits in the row above: GPIO25 at B6, GPIO26 at B10, GPIO17 at B14. The back carries eight horizontal wires: two rail links and six device power jumpers, with no diagonals and no crossings.</desc>

