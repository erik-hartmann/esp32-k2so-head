# Reference:
#https://github.com/pioarduino/platform-espressif32/blob/develop/examples/espidf-arduino-blink/platformio.ini

[platformio]
src_dir = main
default_envs = esp32-devkitc

[env]

#platform = https://github.com/pioarduino/platform-espressif32.git#develop
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
#platform = espressif32
#framework = arduino, espidf
framework = espidf
monitor_speed = 115200
monitor_filters = direct
; WiFi/WebServer + Adafruit_NeoPixel no longer fit in the default 1MB app
; partition. partitions.csv gives the app 3MB out of the 4MB flash instead.
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

# Each env below is one physical board variant. board_config.h picks the
# matching header under main/board_configs/ from BOARD_CONFIG_HEADER, so
# adding a new board means: add a header, add an env here pointing at it —
# no changes to any .cpp file.

[env:esp32dev]
; ELEGOO EL-SM-012 (ESP32-WROOM-32)
board = esp32dev
build_flags =
    -D BOARD_CONFIG_HEADER='"board_configs/elegoo_esp32_wroom32.h"'

[env:esp32-devkitc]
; Official Espressif ESP32-DevKitC
board = esp32dev
build_flags =
    -D BOARD_CONFIG_HEADER='"board_configs/esp32_devkitc.h"'

# Over-the-air updates are not a separate env. An espota env here builds a
# second, identical copy of the firmware into its own directory, and
# PlatformIO's ESP-IDF builder fails on the combination anyway. Instead, build
# once with the env above and push that exact binary — the same one you can
# verify over USB — with the uploader vendored in the arduino component:
#
#   1. Hold the board's admin button for a second to bring the AP up
#   2. Join "ESP32-LEDs" from the machine doing the upload
#   3. python components/arduino/tools/espota.py -i 192.168.4.1 -p 3232 \
#          -f .pio/build/esp32-devkitc/firmware.bin
#
# USB is still required for anything that changes the partition table; OTA can
# only replace an app image, not the layout it sits in.

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    -D BOARD_CONFIG_HEADER='"board_configs/esp32_s3_generic.h"'

[env:esp32-c3-devkitc-02]
board = esp32-c3-devkitc-02
build_flags =
    -D BOARD_CONFIG_HEADER='"board_configs/esp32_c3_generic.h"'

# c6/h2 envs are left without a BOARD_CONFIG_HEADER on purpose: board_config.h
# will fail the build with a clear #error until a config header is added for
# them, rather than silently building with wrong pins.
[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1

[env:esp32-h2-devkitm-1]
board = esp32-h2-devkitm-1
